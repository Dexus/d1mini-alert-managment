<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:28px;font-weight:bold}.s{font-size:18px}.b{font-size:18px;font-weight:bold}.box{fill:#fff;stroke:#222;stroke-width:2}.p{fill:#eef6ff;stroke:#286090}.o{fill:#fff4e5;stroke:#b85c00}.g{fill:#eef9ee;stroke:#2d7a2d}.r{stroke:#d00;stroke-width:4;fill:none}.k{stroke:#111;stroke-width:3;fill:none}.sig{stroke:#087a2f;stroke-width:3;fill:none}.note{fill:#fff8d8;stroke:#a88400}.warn{fill:#ffecec;stroke:#b00020}</style>
<text x="40" y="50" class="h">D1 mini Alarm Receiver – Alternative ohne Pass-Through/UPS-Powerbank</text>
<text x="40" y="82" class="s">Ziel: unterbrechungsfreier Receiver trotz Powerbank ohne gleichzeitiges Laden/Entladen</text>
<rect x="50" y="130" width="220" height="120" class="p box"/><text x="80" y="165" class="b">USB-Ladegerät 5 V</text><text x="80" y="200" class="s">Netzversorgung</text>
<rect x="350" y="105" width="330" height="180" class="g box"/><text x="390" y="145" class="b">Externer 5-V Power-Path</text><text x="390" y="180" class="s">Ideal-Diode / Load-Sharing</text><text x="390" y="215" class="s">z. B. fertiges UPS-/Power-Path-Modul</text><text x="390" y="248" class="s">mit sauberem 5-V-Ausgang</text>
<path d="M270 190 H350" class="r"/><text x="287" y="175" class="s">5 V MAIN</text>
<rect x="50" y="345" width="300" height="150" class="o box"/><text x="80" y="385" class="b">Powerbank ohne Pass-Through</text><text x="80" y="420" class="s">10.000 mAh</text><text x="80" y="455" class="s">5 V OUT / max. 2,1 A</text>
<path d="M350 420 H520 V285" class="r"/><text x="375" y="405" class="s">5 V BACKUP</text>
<rect x="760" y="105" width="260" height="190" class="p box"/><text x="820" y="150" class="b">D1 mini ESP8266</text><text x="800" y="185" class="s">USB / 5V Eingang</text><text x="800" y="220" class="s">D5 GPIO14 → LED</text><text x="800" y="255" class="s">D6 GPIO12 → Summer</text>
<path d="M680 170 H760" class="r"/><text x="700" y="155" class="s">5 V SYS</text><path d="M680 235 H760" class="k"/><text x="700" y="258" class="s">GND</text>
<rect x="720" y="330" width="380" height="115" class="note box"/><text x="750" y="365" class="b">Lokale Pufferung</text><text x="750" y="400" class="s">1000–2200 µF Low-ESR + 100 nF Keramik</text><text x="750" y="430" class="s">zwischen 5 V SYS und GND</text>
<rect x="90" y="545" width="520" height="230" class="o box"/><text x="120" y="580" class="b">LED-Treiber</text><text x="120" y="620" class="s">6× blaue LED, je 150 Ω</text><text x="120" y="655" class="s">Low-Side über AO3400A / 3,3-V Logic-Level N-MOSFET</text><text x="120" y="690" class="s">D5 → 100 Ω → Gate, Gate → 10 kΩ → GND</text><text x="120" y="725" class="s">Source → GND, LEDs an 5 V SYS</text>
<rect x="790" y="545" width="500" height="230" class="o box"/><text x="820" y="580" class="b">Summer-Treiber (optional)</text><text x="820" y="620" class="s">5-V-Aktivsummer über zweiten N-MOSFET</text><text x="820" y="655" class="s">D6 → 100 Ω → Gate, Gate → 10 kΩ → GND</text><text x="820" y="690" class="s">Source → GND, Summer an 5 V SYS</text>
<path d="M760 220 C660 340 620 500 600 565" class="sig"/><path d="M1020 255 C1110 350 1110 500 1080 545" class="sig"/>
<rect x="80" y="800" width="1240" height="70" class="warn box"/><text x="105" y="830" class="b">Nicht einfach parallel verbinden:</text><text x="350" y="830" class="s">USB-Netzteil und Powerbank dürfen nicht ohne Power-Path/Ideal-Diode zusammengeschaltet werden. Rückspeisung und undefinierte Umschaltung vermeiden.</text><text x="105" y="858" class="s">Die Powerbank selbst wird separat geladen. Für echtes Always-On ist das externe Power-Path-Modul der entscheidende Baustein.</text>
</svg>