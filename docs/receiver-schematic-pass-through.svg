<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<style>text{font-family:Arial,sans-serif;fill:#111}.h{font-size:28px;font-weight:bold}.s{font-size:18px}.b{font-size:18px;font-weight:bold}.box{fill:#fff;stroke:#222;stroke-width:2}.p{fill:#eef6ff;stroke:#286090}.o{fill:#fff4e5;stroke:#b85c00}.g{fill:#eef9ee;stroke:#2d7a2d}.r{stroke:#d00;stroke-width:4;fill:none}.k{stroke:#111;stroke-width:3;fill:none}.sig{stroke:#087a2f;stroke-width:3;fill:none}.note{fill:#fff8d8;stroke:#a88400}</style>
<text x="40" y="50" class="h">D1 mini Alarm Receiver – Versorgung mit Pass-Through/UPS-Powerbank</text>
<text x="40" y="82" class="s">Eine Powerbank pro Receiver · 5 V / max. 2,1 A · Laden und Betrieb gleichzeitig nur bei verifiziertem Pass-Through/UPS</text>
<rect x="50" y="130" width="220" height="120" class="p box"/><text x="80" y="165" class="b">USB-Ladegerät 5 V</text><text x="80" y="200" class="s">→ Powerbank IN</text>
<rect x="360" y="115" width="300" height="160" class="g box"/><text x="395" y="155" class="b">Powerbank 10.000 mAh</text><text x="395" y="190" class="s">Pass-Through / UPS</text><text x="395" y="222" class="s">OUT: 5 V / max. 2,1 A</text>
<path d="M270 190 H360" class="r"/><text x="290" y="178" class="s">5 V IN</text>
<rect x="760" y="100" width="260" height="190" class="p box"/><text x="820" y="145" class="b">D1 mini ESP8266</text><text x="800" y="180" class="s">USB / 5V Eingang</text><text x="800" y="215" class="s">D5 GPIO14 → LED</text><text x="800" y="248" class="s">D6 GPIO12 → Summer</text>
<path d="M660 165 H760" class="r"/><text x="685" y="150" class="s">5 V</text><path d="M660 225 H760" class="k"/><text x="680" y="248" class="s">GND</text>
<rect x="710" y="330" width="360" height="110" class="note box"/><text x="740" y="365" class="b">Lokale Pufferung am Receiver</text><text x="740" y="400" class="s">1000 µF Low-ESR + 100 nF Keramik zwischen 5 V und GND</text>
<rect x="90" y="500" width="520" height="250" class="o box"/><text x="120" y="535" class="b">LED-Treiber</text><text x="120" y="575" class="s">6× blaue LED, je eigener Vorwiderstand</text><text x="120" y="610" class="s">5 V → LED → 150 Ω → Drain Q1</text><text x="120" y="645" class="s">Q1: AO3400A / geeigneter 3,3-V Logic-Level N-MOSFET</text><text x="120" y="680" class="s">Source → GND</text><text x="120" y="715" class="s">D5 → 100 Ω → Gate; Gate → 10 kΩ → GND</text>
<path d="M760 220 C650 300 620 500 610 560" class="sig"/><text x="625" y="475" class="s">D5</text>
<rect x="790" y="500" width="500" height="250" class="o box"/><text x="820" y="535" class="b">Summer-Treiber (optional)</text><text x="820" y="575" class="s">5-V-Aktivsummer</text><text x="820" y="610" class="s">5 V → Summer → Drain Q2</text><text x="820" y="645" class="s">Q2: AO3400A / geeigneter 3,3-V Logic-Level N-MOSFET</text><text x="820" y="680" class="s">Source → GND</text><text x="820" y="715" class="s">D6 → 100 Ω → Gate; Gate → 10 kΩ → GND</text>
<path d="M1020 245 C1110 330 1110 470 1080 500" class="sig"/><text x="1090" y="430" class="s">D6</text>
<rect x="80" y="790" width="1240" height="75" class="note box"/><text x="105" y="820" class="b">Wichtig:</text><text x="205" y="820" class="s">Die 2,1 A sind nur die maximale Lieferfähigkeit. Der Receiver benötigt typischerweise deutlich weniger. Entscheidend ist unterbrechungsfreier OUT-Betrieb beim Ein-/Ausstecken des Ladegeräts.</text><text x="105" y="850" class="s">Powerbank vor Einsatz testen: Laden + Alarmbetrieb, Netzteil abziehen/anstecken, keine ESP-Resets, kein Auto-Shutdown.</text>
</svg>