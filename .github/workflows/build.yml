name: build

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Create CI configuration
        run: cp include/config.example.h include/config.h

      - name: Build sender
        run: pio run -e sender

      - name: Build receiver
        run: pio run -e receiver
